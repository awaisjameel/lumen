# The checks every change passes: scripts/lint.sh (static checks, frontend
# tests, documentation links), the Go race tests, a production build that
# must leave the bindings and go.mod as committed, and the large-library
# latency gate. Hosted runners are slower than the machine the latency
# budgets were set on, so here that gate reports without failing;
# scripts/lint.sh on a developer's machine stays the binding gate.
# The jobs run side by side, the race tests split three ways because the
# store's tests alone take as long as every other package together.
# The release workflow calls this one, so a release passes the same checks.
name: CI

# Every change is checked on its pull request, so a merge does not repeat the
# work, with one exception: a merge that changes what the caches hold runs
# again to save them on main. A pull request's caches are visible only to
# that pull request, so without main's, each new one would start cold.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - frontend/package-lock.json
      - scripts/deps.sh
      - scripts/compression-deps.sh
      - scripts/oxipng-deps.sh
      - scripts/oxipng-notices.py
      - scripts/prepare_models.py
      - native/lumen-raw/**
      - .github/actions/**
      - .github/workflows/ci.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the pull request's commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commit-msg.sh --range "$BASE..$HEAD"

  checks:
    name: Build and static checks
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go-cache: build
          wails: "true"

      # First, because Lumen.exe embeds frontend/dist, which a fresh clone
      # lacks: no Go package compiles before the frontend is built.
      - name: Production build
        shell: bash
        run: wails3 build
      # The build regenerates the bindings and tidies go.mod: both must
      # already be committed as it leaves them.
      - name: Bindings and modules are current
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "::error::the build changed tracked files: regenerate the bindings (README, Commands) and commit them"
            exit 1
          fi

      - name: Static checks, frontend tests and links
        shell: bash
        run: scripts/lint.sh --no-bench

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache

  tests:
    name: Go tests, ${{ matrix.shard }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The store's randomised oracles take as long as the rest of its
        # tests, so -run and -skip split the package between two jobs.
        include:
          - shard: store oracles
            packages: ./internal/store
            tests: -run Randomised
            cache: race-store
          - shard: store
            packages: ./internal/store
            tests: -skip Randomised
            cache: race-store
          - shard: everything else
            packages: . ./internal/... ./services/... ./cmd/... ./scripts/...
            skip: lumen/internal/store
            cache: race-rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go-cache: ${{ matrix.cache }}

      # Go embeds frontend/dist; the tests need it to exist, not to be
      # checked, which the build job does.
      - name: Build the frontend
        shell: bash
        run: cd frontend && npx vite build --mode production --logLevel warn

      - name: Go tests (race detector)
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          SKIP: ${{ matrix.skip }}
          TESTS: ${{ matrix.tests }}
        run: |
          source scripts/env.sh
          read -ra patterns <<<"$PACKAGES"
          read -ra tests <<<"$TESTS"
          mapfile -t pkgs < <(go list "${patterns[@]}" | grep -vxF "${SKIP:-.}")
          # Native models and filesystem tests must not compete across
          # packages on hosted runners, so the tests run one package at a
          # time; compiling them first keeps the build itself parallel.
          go test -race -count=1 -timeout 1800s -run '^$' "${pkgs[@]}" >/dev/null
          go test -race -p 1 -count=1 -timeout 1800s "${tests[@]}" "${pkgs[@]}"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache

  latency:
    name: Large-library latency
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go-cache: bench

      - name: Build the frontend
        shell: bash
        run: cd frontend && npx vite build --mode production --logLevel warn

      - name: Large-library latency (reported, not enforced)
        id: bench
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          scripts/bench.sh 2>&1 | tee "$RUNNER_TEMP/bench.log"
      - name: Report the latency gate
        if: always() && steps.bench.outcome != 'skipped'
        shell: bash
        env:
          OUTCOME: ${{ steps.bench.outcome }}
        run: |
          {
            echo "## Large-library latency: $OUTCOME"
            echo
            echo "Reported, not enforced: the budgets were set on an i7-13700H, and \`scripts/lint.sh\` there is the binding gate."
            echo
            echo '```text'
            sed -n '/^benchmark /,$p' "$RUNNER_TEMP/bench.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = failure ]; then
            echo "::warning title=Latency budgets::a figure exceeded its budget on this runner; check it on a developer machine with scripts/bench.sh"
          fi

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache

name: Set up the Lumen build
description: >-
  The pinned toolchain the README's "Building from source" names (Go, Node,
  Python, llvm-mingw, the Wails CLI), the native dependencies scripts/deps.sh
  fetches and prepares, cached between runs, and the frontend's packages.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    # Node 24.21.0 bundles npm 11.19.0, the oldest frontend/package.json's
    # engines accept (engine-strict is on).
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    # The clang cgo, LibRaw and OxiPNG are built with, pinned with its hash.
    - id: llvm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/llvm-mingw
        key: llvm-mingw-20260922-ucrt-x86_64
    - name: Fetch llvm-mingw
      if: steps.llvm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        tmp=$(cygpath -u "$RUNNER_TEMP")
        curl -fL --retry 3 -o "$tmp/llvm-mingw.zip" \
          https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-x86_64.zip
        echo "e3ad77d117a4bea19a7a3b333341824d79a5a371004a10e25b8504e7b3047666 *$tmp/llvm-mingw.zip" | sha256sum -c
        unzip -q "$tmp/llvm-mingw.zip" -d "$tmp"
        mv "$tmp/llvm-mingw-20260922-ucrt-x86_64" "$tmp/llvm-mingw"
        rm "$tmp/llvm-mingw.zip"
    - name: Put the toolchain on PATH
      shell: bash
      run: |
        cygpath -w "$(cygpath -u "$RUNNER_TEMP")/llvm-mingw/bin" >>"$GITHUB_PATH"
        echo 'C:\Program Files\7-Zip' >>"$GITHUB_PATH"
        { echo CGO_ENABLED=1; echo CC=clang; echo CXX=clang++; } >>"$GITHUB_ENV"

    # The CLI at the version go.mod already pins, so there is one source.
    # The module proxy sometimes drops a download mid-stream, so retry.
    - name: Install the Wails CLI
      shell: bash
      run: |
        version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
        for attempt in 1 2 3; do
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version" && exit 0
          echo "::warning::go install failed (attempt $attempt of 3)"
          sleep $((attempt * 15))
        done
        exit 1

    # Everything scripts/deps.sh fetches is pinned by hash, so the key is the
    # scripts and sources that decide what it builds. The downloads also
    # keep a cold build working after an upstream prunes a pinned file.
    - id: deps
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          !deps/src
          !deps/oxipng/rustc-*
          !deps/oxipng/cargo-*
          !deps/oxipng/rust-std-*
        key: deps-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-llvm-mingw-20260922-${{ hashFiles('scripts/deps.sh', 'scripts/compression-deps.sh', 'scripts/oxipng-deps.sh', 'scripts/oxipng-notices.py', 'scripts/prepare_models.py', 'native/lumen-raw/**', 'go.mod') }}
        restore-keys: deps-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-llvm-mingw-20260922-
    # On an exact hit the key proves the prepared models and the RAW worker
    # match their sources, but checkout gives the sources a newer time than
    # the restored outputs, which would make deps.sh rebuild them.
    - name: Mark the cached builds current
      if: steps.deps.outputs.cache-hit == 'true'
      shell: bash
      run: touch -c deps/runtime/models/*/*.json deps/runtime/lumen-raw.exe
    - name: Fetch and prepare the native dependencies
      shell: bash
      run: scripts/deps.sh

    - name: Install the frontend's packages
      shell: bash
      run: npm ci --prefix frontend

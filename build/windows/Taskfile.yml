version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing (task package): set SIGN_THUMBPRINT to a code-signing certificate
  # in your Windows certificate store (where a hardware token's or a cloud
  # signing service's certificate appears), and TIMESTAMP_SERVER, e.g.
  #   wails3 task package SIGN_THUMBPRINT=... TIMESTAMP_SERVER=http://timestamp.digicert.com
  # The Windows SDK's signtool must be on PATH: it signs Lumen.exe, and NSIS
  # runs it on the installer and the uninstaller. Without a thumbprint, the
  # installer is built unsigned, and says so.

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      # Lumen needs cgo (SQLite, libvips, ONNX Runtime and WIC), so it is on by default.
      CGO_ENABLED: '{{.CGO_ENABLED | default "1"}}'

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '[ -f deps/vips/lib/libvips.lib ] && [ -f deps/runtime/models/siglip2/siglip2.json ] && [ -f deps/runtime/models/faces/faces.json ]'
        msg: "Native dependencies missing: run scripts/deps.sh (Git Bash) once. It fetches libvips, ONNX Runtime, FFmpeg and the models into deps/."
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "1"}}'
      # llvm-mingw's clang is the C toolchain (see README).
      CC: '{{.CC | default "clang"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - rm -f *.syso
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Builds Lumen's installer, bin/Lumen-<version>-x64-setup.exe, signed when a certificate is set (see vars)
    dir: build/windows/nsis
    deps:
      - task: build
    preconditions:
      - sh: '[ -f "{{.MAKENSIS}}" ] && [ -f "{{.WEBVIEW2}}" ] && [ -f "{{.ROOT_DIR}}/deps/licenses/libvips.LICENSE.txt" ]'
        msg: "Run scripts/deps.sh (Git Bash) once: it fetches NSIS, the WebView2 runtime the installer carries, and the licences."
      - sh: '[ "{{.ARCH}}" = "amd64" ]'
        msg: "Lumen's installer is x64 only, as its DLLs are."
      - sh: '[ -f "{{.ROOT_DIR}}/deps/runtime/compress/jpegtran.exe" ] && [ -f "{{.ROOT_DIR}}/deps/runtime/compress/djpeg.exe" ] && [ -f "{{.ROOT_DIR}}/deps/runtime/compress/libjpeg-62.dll" ] && [ -f "{{.ROOT_DIR}}/deps/runtime/compress/oxipng.exe" ] && [ -f "{{.ROOT_DIR}}/deps/runtime/compress/cjxl.exe" ] && [ -f "{{.ROOT_DIR}}/deps/runtime/compress/djxl.exe" ]'
        msg: "Compression tools missing: run scripts/deps.sh (Git Bash) before packaging."
      - sh: '{{if .SIGN_THUMBPRINT}}command -v signtool >/dev/null{{else}}true{{end}}'
        msg: "Signing needs the Windows SDK's signtool on PATH."
    cmds:
      - '{{if .SIGN_THUMBPRINT}}signtool {{.SIGNTOOL_ARGS}} "{{fromSlash (printf "%s/%s/%s.exe" .ROOT_DIR .BIN_DIR .APP_NAME)}}"{{else}}echo "No SIGN_THUMBPRINT: building an unsigned installer."{{end}}'
      - python "{{.ROOT_DIR}}/scripts/notices.py" "{{.ROOT_DIR}}/{{.BIN_DIR}}/THIRD_PARTY_NOTICES.txt"
      - python "{{.ROOT_DIR}}/scripts/installer_payload.py" "{{.ROOT_DIR}}/deps/runtime" "{{.ROOT_DIR}}/{{.BIN_DIR}}/lumen-runtime.nsh"
      # NSIS's File wants Windows paths.
      - >-
        "{{.MAKENSIS}}" -V2
        "-DARG_WAILS_AMD64_BINARY={{fromSlash (printf "%s/%s/%s.exe" .ROOT_DIR .BIN_DIR .APP_NAME)}}"
        "-DLUMEN_RUNTIME={{fromSlash (printf "%s/deps/runtime" .ROOT_DIR)}}"
        "-DLUMEN_PAYLOAD={{fromSlash (printf "%s/%s/lumen-runtime.nsh" .ROOT_DIR .BIN_DIR)}}"
        "-DLUMEN_NOTICES={{fromSlash (printf "%s/%s/THIRD_PARTY_NOTICES.txt" .ROOT_DIR .BIN_DIR)}}"
        "-DLUMEN_WEBVIEW2={{fromSlash .WEBVIEW2}}"
        {{if .SIGN_THUMBPRINT}}"-DLUMEN_SIGN=signtool {{.SIGNTOOL_ARGS}} \"%1\""{{end}}
        project.nsi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      MAKENSIS: '{{.ROOT_DIR}}/deps/tools/nsis/makensis.exe'
      WEBVIEW2: '{{.ROOT_DIR}}/deps/installer/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
      # signtool picks the certificate from the user's store by its thumbprint.
      # NSIS puts each file it signs in for %1 (the uninstaller is a .tmp file).
      SIGNTOOL_ARGS: 'sign /fd SHA256 /sha1 {{.SIGN_THUMBPRINT}}{{if .TIMESTAMP_SERVER}} /tr {{.TIMESTAMP_SERVER}} /td SHA256{{end}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

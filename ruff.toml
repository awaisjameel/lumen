# Ruff: lint and format for scripts/*.py (model preparation) and e2e/**/*.py
# (test fixtures). Pinned and installed by scripts/deps.sh; run through
# scripts/lint.sh.
target-version = "py315"
line-length = 120
include = ["scripts/**/*.py", "e2e/**/*.py"]
extend-exclude = ["e2e/node_modules", "e2e/.work", "e2e/.cache"]

[lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # import order
  "B",       # bugbear: likely bugs
  "UP",      # pyupgrade: modern syntax
  "SIM",     # simplifications
  "C4",      # comprehensions
  "PTH",     # pathlib over os.path
  "RET",     # return statements
  "PL",      # pylint
  "RUF",     # ruff's own
  "N",       # naming
  "S",       # security (bandit)
]
ignore = [
  "PLR2004", # "magic" numbers: model shapes and file-format constants read better inline
  "S310",    # urllib.urlopen: a pinned revision, and prepare_models.py checks the values it reads
]

[format]
quote-style = "double"

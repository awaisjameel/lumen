<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Lumen</title>
    <link rel="icon" href="/lumen.png" />
    <script>
      // The first frame, before the app's script has loaded: the theme last
      // applied (src/design/appearance.ts keeps it in lumen.appearance; an
      // older Lumen kept lumen.theme), else Windows' own. The app applies
      // the library's preferences as soon as it runs.
      ;(function () {
        var theme = ''
        try {
          theme =
            (JSON.parse(localStorage.getItem('lumen.appearance')) || {}).theme || localStorage.getItem('lumen.theme')
        } catch (e) {
          theme = ''
        }
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
